
<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎉 Happy Birthday 🎉</h1>

        <div class="balloons">
            🎈 🎈 🎈 🎈 🎈
        </div>

        <div class="cake">🎂</div>

        <h2>Dear Birthday Star!</h2>

        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
