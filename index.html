<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday, Sister! ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { font-size: 2.5rem; }
    p { font-size: 1.2rem; line-height: 1.7; }
    button {
      padding: 14px 24px;
      border: none;
      border-radius: 25px;
      background: white;
      color: #e84378;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1> Happy Birthday, My Sister!&#10084; ❤️</h1>
  <p>You are one of the most special people in my life.<br>
  May your day be filled with love, happiness and beautiful memories! 💖</p>
  <button onclick="showWish()">Open Your Surprise 🎁</button>
  <script>
    function showWish() {
      alert("You are not just my sister, you are my forever best friend! ❤️");
    }
  </script>
</body>
</html>
